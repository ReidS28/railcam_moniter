[project]
name = "railstream-moniter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "pathlib>=1.0.1",
    "playwright>=1.61.0",
    "pre-commit>=4.6.1",
    "slack-sdk>=3.43.0",
    "termcolor>=3.3.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "ultralytics>=8.4.107",
    "webdriver-manager>=4.1.2",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[dependency-groups]
dev = [
    "coverage>=7.16.2",
]
